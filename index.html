<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palestine Volunteers – Demo</title>
    <meta name="description" content="Interactive demo of the Palestine Volunteer Signup Platform. Runs entirely in your browser with sample data." />
    <meta name="theme-color" content="#007a3d" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="flex min-h-dvh flex-col">
    <div aria-hidden="true" class="flex h-1.5">
      <span class="flex-1 bg-stone-900"></span>
      <span class="flex-1 bg-white"></span>
      <span class="flex-1 bg-brand-600"></span>
      <span class="w-10 bg-accent-600"></span>
    </div>
    <div class="bg-amber-100 text-amber-950">
      <div class="container-page flex flex-wrap items-center gap-x-4 gap-y-1 py-2 text-xs sm:text-sm">
        <strong>Demo</strong>
        <span class="flex-1">Sample data, stored only in your browser. Emails are shown in the demo outbox, not sent.</span>
        <a href="#/outbox" class="font-semibold underline">Email outbox</a>
        <button type="button" data-action="reset" data-confirm="Reset the demo to its original sample data?" class="font-semibold underline">Reset demo</button>
      </div>
    </div>
    <header id="nav" class="border-b border-stone-200 bg-white"></header>
    <main id="app" class="container-page flex-1 py-6 sm:py-10" tabindex="-1"></main>
    <footer class="border-t border-stone-200 bg-white py-6">
      <div class="container-page flex flex-col gap-2 text-sm text-stone-500 sm:flex-row sm:justify-between">
        <span>Palestine Volunteer Signup Platform · demo build</span>
        <a href="#/events" class="hover:text-brand-700">Upcoming events</a>
      </div>
    </footer>
    <div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex justify-center px-4"></div>
    <script src="app.js"></script>
  </body>
</html>
